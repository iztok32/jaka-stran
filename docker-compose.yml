# docker-compose.yml — lokalno testiranje
# Uporaba: npm run build && docker compose up --build
#
# Za produkcijsko postavitev na strežniku:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: iztokvozlic/jaka-stran:latest
    ports:
      - "8085:80"
    environment:
      APP_NAME: "Jaka Vozlič Photography"
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:8082}
      APP_LOCALE: sl
      APP_FALLBACK_LOCALE: en
      AVAILABLE_LANGUAGES: sl
      AVAILABLE_COLOR_THEMES: zinc,amber,blue,emerald,orange
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: jaka_stran
      DB_USERNAME: jaka_user
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      FILESYSTEM_DISK: public
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-info@jakaphotography.si}
      MAIL_FROM_NAME: "Jaka Vozlič Photography"
      NOTIFICATION_ENABLE_PORTAL: "true"
      NOTIFICATION_ENABLE_EMAIL: "true"
      NOTIFICATION_ENABLE_SMS: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage_uploads:/var/www/html/storage/app/public
      - storage_logs:/var/www/html/storage/logs
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: jaka_stran
      POSTGRES_USER: jaka_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jaka_user -d jaka_stran"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  storage_uploads:
  storage_logs:
