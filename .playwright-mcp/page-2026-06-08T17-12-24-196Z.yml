    - generic [ref=e94]:
      - generic [ref=e95]: O fotografu
      - heading "Jaka Vozlič" [level=2] [ref=e97]
      - paragraph [ref=e98]: Fotograf z dušo — lovim akcijo, vzdušje in trenutke, ki jih ni mogoče ponoviti. Športna, dokumentarna in komercialna fotografija z avtentičnim pristopom.
      - generic [ref=e99]:
        - paragraph [ref=e100]: Sem fotograf z bazo v Sloveniji. Fotografija zame ni le posel — je način, kako vidim svet. Vsak projekt pristopam z radovednostjo, potrpežljivostjo in globokim spoštovanjem do svojih naročnikov.
        - paragraph [ref=e101]: Specializiran sem za športno, dokumentarno in komercialno fotografijo. Fotografiram dinamično, ko je potrebna hitrost in ostrina, dokumentarno, ko gre za vzdušje in čustva, ter umetniško, ko trenutek to dopušča. Moje delo je vedno pristno — brez pretiranega poziranja, z visoko mero pozornosti do detajlov in svetlobe.
        - paragraph [ref=e102]: Sodelujem s klubi, atleti, organizatorji dogodkov, umetniki, mediji in znamkami — za vsakega naročnika prilagodim pristop glede na potrebe in namen fotografij.
